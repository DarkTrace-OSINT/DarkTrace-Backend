name: Backend CI/CD (AWS EC2)

on:
  push:
    branches: [ "main" ] # main 브랜치에 push 될 때 작동

jobs:
  deploy:
    runs-on: self-hosted # AWS 서버에서 직접 실행

    steps:
    - name: 1. 최신 코드 가져오기
      uses: actions/checkout@v3

    - name: 2. gradlew 실행 권한 부여
      run: chmod +x ./gradlew

    - name: 3. Spring Boot 프로젝트 빌드 (테스트 제외)
      run: ./gradlew clean build -x test

    - name: 4. 기존 실행 중인 서버 종료 (8080 포트)
      run: |
        sudo fuser -k -n tcp 8080 || true

    - name: 5. 환경변수 주입 및 새 서버 무중단 실행
      env:
        JASYPT_ENCRYPTOR_PASSWORD: ${{ secrets.JASYPT_ENCRYPTOR_PASSWORD }}
        DB_URL: ${{ secrets.DB_URL }}
        DB_USERNAME_ENC: ${{ secrets.DB_USERNAME_ENC }}
        DB_PASSWORD_ENC: ${{ secrets.DB_PASSWORD_ENC }}
        API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        REDIRECT_URL: ${{ secrets.REDIRECT_URL }}
      run: |
        export RUNNER_TRACKING_ID=""
        
        nohup java -jar \
          -Dlogging.level.org.springframework.security=DEBUG \
          -Dlogging.level.org.springframework.web=DEBUG \
          -Djasypt.encryptor.password="$JASYPT_ENCRYPTOR_PASSWORD" \
          -Dspring.datasource.url="$DB_URL" \
          -Dspring.datasource.username="$DB_USERNAME_ENC" \
          -Dspring.datasource.password="$DB_PASSWORD_ENC" \
          -Dspring.jpa.hibernate.ddl-auto=update \
          -Djwt.secret="local-test-secret-key-darktrace-project-2026-fighting" \
          -Djwt.expiration=86400000 \
          -DAPI_KEY_SECRET="$API_KEY_SECRET" \
          -DGOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
          -DGOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
          -DREDIRECT_URL="$REDIRECT_URL" \
          build/libs/*SNAPSHOT.jar > application.log 2>&1 &
