# [1] Server Settings
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# [2] Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/darktrace?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rows3690
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# [3] JPA & Hibernate Settings
# validate -> update? ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=1000
spring.jpa.open-in-view=false
# ?? Hibernate ??? ?? ??
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# [4] Security & JWT
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
api.key.secret=${API_KEY_SECRET}

# [5] OAuth2 Client Registration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${REDIRECT_URL}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Swagger ?? ??
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
# ?? API ?? ??
springdoc.packages-to-scan=com.example.demo

# Logging Settings
logging.level.root=INFO
logging.level.com.example.demo=DEBUG

